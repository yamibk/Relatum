<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatum Reference</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  </style>
  <link rel="stylesheet" href="styles.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      startup: { typeset: false }
    };
  </script>
</head>
<body class="editor-page embed canvas-readonly dual-reference-page"
      data-mode="normal" data-mode-submode="full" data-normal-submode="full">
  <div class="dual-reference-background" data-role="dual-reference-background" aria-hidden="true"></div>
  <main class="editor-main dual-reference-main">
    <div class="canvas-viewport" data-role="canvas-viewport">
      <div class="canvas-guide-layer" data-role="canvas-guide-layer" aria-hidden="true" hidden></div>
      <canvas class="canvas-edges-canvas" data-role="canvas-edges-canvas" aria-hidden="true"></canvas>
      <div class="canvas-surface" data-role="canvas-surface">
        <svg class="canvas-edges-layer" data-role="canvas-edges" width="4000" height="3000"></svg>
        <svg class="canvas-ink-layer" data-role="canvas-ink" width="4000" height="3000"></svg>
        <div class="canvas-empty-hint" data-role="empty-hint">这张画布还没有内容</div>
      </div>
      <div class="viewport-hud-bl dual-reference-hud">
        <button type="button" class="zoom-indicator" data-role="zoom-indicator"
                title="重置到 100%">100%</button>
      </div>
      <div class="dual-reference-error" data-role="dual-reference-error" role="alert" hidden></div>
    </div>
  </main>

  <div class="node-menu dual-reference-menu" data-role="node-menu" hidden>
    <button type="button" class="node-menu-item" data-action="copy-to-main">复制到主画布</button>
  </div>

  <script src="sticky-palette.js" defer></script>
  <script src="mermaid-renderer.js" defer></script>
  <script src="richtext.js" defer></script>
  <script src="markdown-table.js" defer></script>
  <script src="markdown.js" defer></script>
  <script src="table-editor.js" defer></script>
  <script src="dual-clipboard.js" defer></script>
  <script src="canvas.js" defer></script>
  <script src="dual-viewer.js" defer></script>
</body>
</html>
