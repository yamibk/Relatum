<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatum Research</title>
  <script>
    try {
      if (localStorage.getItem('research:sidePanelCollapsed:v1') === '1') {
        document.documentElement.classList.add('research-side-panel-pref-collapsed');
      }
    } catch (_error) {}
  </script>
  <link rel="stylesheet" href="research/research.css">
  <script src="research/research-i18n-en.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="research/research-workspace.js" defer></script>
</head>
<body>
  <main class="research-stage" data-research-stage>
    <div class="research-viewport" data-research-viewport tabindex="0" role="application" aria-label="研究画布">
      <canvas class="research-edges" data-research-edges aria-hidden="true"></canvas>
      <div class="research-surface" data-research-surface></div>
      <svg class="research-active-edges" data-research-active-edges aria-hidden="true"></svg>
      <div class="research-selection-frame" data-research-selection-frame hidden></div>
      <div class="research-viewport-hud">
        <button type="button" class="research-zoom-indicator" data-research-zoom-indicator
          aria-label="恢复为 100% 缩放" title="点击恢复为 100% 缩放（Ctrl+0）">100%</button>
        <div class="research-minimap" data-research-minimap hidden
          aria-label="研究小地图：点击跳转，拖动取景框平移">
          <div class="research-minimap-nodes" data-research-minimap-nodes></div>
          <div class="research-minimap-viewbox" data-research-minimap-viewbox></div>
        </div>
      </div>
    </div>
    <nav class="research-page-rail" data-research-page-rail aria-label="研究页面">
      <div class="research-page-list" data-research-page-list>
        <span class="research-page-orb" data-research-page-orb aria-hidden="true"></span>
      </div>
      <button type="button" class="research-page-add" data-research-page-add aria-label="新建研究页">＋</button>
    </nav>
    <div class="research-page-hotspot" data-research-page-hotspot aria-hidden="true"></div>
    <div class="research-corner-actions" data-research-corner-actions>
      <button type="button" class="research-page-delete" data-research-page-delete
        aria-label="删除当前空白研究页" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6 6.5v9h8v-9M4.5 5h11M8 5V3.5h4V5M8.5 8.5V13M11.5 8.5V13"/>
        </svg>
      </button>
      <button type="button" class="research-origin-fab" data-research-center-origin
        aria-label="将坐标原点移到画面中心" title="将坐标原点移到画面中心">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8.5 7 10 5h4l1.5 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3.5Z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
      </button>
      <button type="button" class="research-settings-fab" data-research-settings-open
        aria-label="研究画布设置" aria-expanded="false" aria-controls="research-settings-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button type="button" class="research-help-fab" data-research-help-open
        aria-label="研究计算使用说明" aria-expanded="false" aria-controls="research-help-panel">?</button>
    </div>
    <div class="research-compute-dock" data-research-compute-dock>
      <div class="research-compute-row" id="research-compute-row" role="toolbar" aria-label="研究工具与仿真控制">
        <button type="button" data-research-add aria-expanded="true" aria-controls="research-side-panel">＋ 添加</button>
        <button type="button" data-research-connection-kind="relation" aria-pressed="false">关系线</button>
        <button type="button" data-research-connection-kind="wire" aria-pressed="true">导线</button>
        <span class="research-compute-separator" aria-hidden="true"></span>
        <button type="button" data-research-run aria-label="运行仿真">运行</button>
        <button type="button" data-research-pause aria-label="暂停仿真">暂停</button>
        <button type="button" data-research-step aria-label="单步到下一个时序边界">单步</button>
        <button type="button" data-research-reset aria-label="复位当前页">复位</button>
        <label class="research-speed-label">速度
          <select data-research-speed aria-label="仿真速度">
            <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
            <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
          </select>
        </label>
      </div>
      <button type="button" class="research-dock-collapse" data-research-dock-collapse
        aria-label="收起下方工具栏" aria-expanded="true" aria-controls="research-compute-row">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 7.5 4.5 4.5 4.5-4.5"/></svg>
      </button>
    </div>
    <aside class="research-side-panel" id="research-side-panel" data-research-side-panel
      role="group" aria-label="研究节点与属性">
      <header class="research-side-panel-head">
        <strong data-research-inspector-title>研究 · 添加节点</strong>
        <button type="button" data-research-inspector-close aria-label="收起研究面板">×</button>
      </header>
      <div class="research-side-panel-body">
        <section class="research-node-library" data-research-node-library aria-label="添加研究节点">
          <input type="search" data-research-add-search placeholder="搜索节点" aria-label="搜索节点">
          <div data-research-add-list></div>
        </section>
        <section class="research-inspector" data-research-inspector hidden aria-label="对象属性">
          <div class="research-inspector-fields" data-research-inspector-fields></div>
          <section class="research-trace" data-research-trace hidden aria-label="运行轨迹">
            <div class="research-trace-head">
              <strong>运行轨迹</strong>
              <button type="button" data-research-trace-clear>清空</button>
            </div>
            <p data-research-trace-summary></p>
            <ol data-research-trace-list></ol>
          </section>
        </section>
        <section class="research-selection-summary" data-research-selection-summary hidden aria-label="选区属性">
          <p data-research-selection-copy></p>
          <button type="button" data-research-subcircuit-create>封装为子电路</button>
        </section>
      </div>
    </aside>
    <div class="research-subcircuit-overlay" data-research-subcircuit-overlay hidden>
      <section class="research-subcircuit-dialog" role="dialog" aria-modal="true" aria-labelledby="research-subcircuit-title">
        <header>
          <strong id="research-subcircuit-title">从选区发布子电路</strong>
          <button type="button" data-research-subcircuit-cancel aria-label="关闭">×</button>
        </header>
        <label>发布方式
          <select data-research-subcircuit-target>
            <option value="new">新建定义</option>
          </select>
        </label>
        <label data-research-subcircuit-name-row>名称
          <input type="text" data-research-subcircuit-name maxlength="120" value="新子电路">
        </label>
        <p data-research-subcircuit-summary></p>
        <div class="research-subcircuit-ports" data-research-subcircuit-ports></div>
        <footer>
          <button type="button" data-research-subcircuit-cancel>取消</button>
          <button type="button" data-research-subcircuit-confirm>发布并替换选区</button>
        </footer>
      </section>
    </div>
    <div class="research-persistence-status" data-research-persistence-status role="status"
      aria-live="polite" hidden></div>
    <section class="research-settings-panel" id="research-settings-panel" data-research-settings-panel
      role="dialog" aria-label="研究画布设置" hidden>
      <header class="research-settings-head">
        <strong>研究画布设置</strong>
        <div class="research-settings-reset" data-research-settings-reset>
          <button type="button" data-research-settings-reset-open aria-expanded="false"
            aria-controls="research-settings-reset-confirm">恢复默认</button>
          <div class="research-settings-reset-confirm" id="research-settings-reset-confirm"
            data-research-settings-reset-confirm role="alertdialog" aria-label="恢复默认设置？" hidden>
            <strong>恢复默认设置？</strong>
            <span>重置研究画布的五项本机设置。</span>
            <div>
              <button type="button" data-research-settings-reset-cancel>取消</button>
              <button type="button" data-research-settings-reset-accept>恢复默认</button>
            </div>
          </div>
        </div>
      </header>
      <label class="research-settings-slider">
        <span>方向键平移速度 <output data-research-pan-speed-value>8</output></span>
        <input type="range" data-research-pan-speed min="1" max="20" step="1" value="8">
      </label>
      <label class="research-settings-slider">
        <span>拖拽惯性 <output data-research-pan-inertia-value>15%</output></span>
        <input type="range" data-research-pan-inertia min="0" max="1" step="0.05" value="0.15">
      </label>
      <label class="research-settings-slider">
        <span>滚轮缩放速度 <output data-research-zoom-speed-value>1×</output></span>
        <input type="range" data-research-zoom-speed min="0.5" max="3" step="0.1" value="1">
      </label>
      <label class="research-settings-check">
        <span>显示 xOy 坐标</span>
        <input type="checkbox" data-research-coordinates-visible>
      </label>
      <label class="research-settings-check">
        <span>显示坐标轴数字</span>
        <input type="checkbox" data-research-coordinate-labels-visible disabled>
      </label>
    </section>
    <div class="research-help-overlay" data-research-help-overlay hidden>
      <section class="research-help-card" id="research-help-panel" role="dialog" aria-modal="true"
        aria-labelledby="research-help-title">
        <header class="research-help-head">
          <div>
            <span>研究工作区</span>
            <h2 id="research-help-title">研究工作区教程</h2>
          </div>
          <button type="button" class="research-help-close" data-research-help-close aria-label="关闭说明">×</button>
        </header>
        <div data-research-tutorial-root></div>
      </section>
    </div>
  </main>
</body>
</html>
